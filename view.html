<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>MOODIARY – 공유 보기</title>

    <!-- 폰트(선택) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
        crossorigin>

    <!-- 압축/복원 -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" crossorigin></script>
    <!-- 캡처 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin></script>

    <style>
        :root {
            --frame-max: 640px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #fff;
            color: #111;
            font-family: Pretendard, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 5;
        }

        header .date {
            font-size: 13px;
            color: #777;
        }

        main {
            padding: 14px;
            display: grid;
            gap: 14px;
        }

        /* 보기 캔버스 */
        .stage-wrap {
            width: min(92vw, var(--frame-max));
            margin: 0 auto;
        }

        #stage {
            position: relative;
            width: 100%;
            /* JS가 정사각으로 픽셀 고정, 초기엔 안전하게 1:1 */
            aspect-ratio: 1/1;
            border: 0.5px solid #111;
            overflow: hidden;
            background: #fff;
            touch-action: manipulation;
            image-rendering: auto;
        }

        /* 배경도 img로(배경이미지 CORS/렌더링 이슈 회피) */
        #bgLayer {
            position: absolute;
            inset: 0;
            z-index: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* 아이템 공통 */
        .item {
            position: absolute;
            transform-origin: center center;
            will-change: transform, left, top, width, height;
            image-rendering: auto;
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            appearance: none;
            border: 0.5px solid #111;
            background: #fff;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
        }

        .hint {
            font-size: 12px;
            color: #777;
            text-align: center
        }

        /* 로딩 */
        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            color: #555;
            padding: 10px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 에러 */
        #error {
            display: none;
            color: #b00020;
            background: #fde7ea;
            border: 1px solid #f5c2c7;
            padding: 10px;
            border-radius: 8px;
            width: min(92vw, var(--frame-max));
            margin: 0 auto;
            font-size: 14px;
        }

        #error b {
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>

<body>
    <header>
        <strong>공유된 정원 보기</strong>
        <div id="dateLabel" class="date">—</div>
    </header>

    <main>
        <div id="error">
            <b>불러오기 실패</b>
            링크가 손상되었거나, 압축 데이터가 잘못되었습니다.<br />
            다시 QR을 생성해서 스캔해 주세요.
        </div>

        <div id="loading">
            <div class="spinner"></div> 불러오는 중…
        </div>

        <div class="stage-wrap">
            <div id="stage" aria-label="공유 정원">
                <!-- 배경을 img로 렌더링 -->
                <img id="bgLayer" alt="background" />
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="btnSave">이미지로 저장</button>
        </div>
        <div class="hint">이미지를 길게 눌러 저장하거나, “이미지로 저장” 버튼을 누르세요.</div>
    </main>

    <script>
        (function () {
            // ====== 유틸 ======
            const $ = sel => document.querySelector(sel);

            function parseHash() {
                const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
                if (!hash) return null;
                try {
                    const json = LZString.decompressFromEncodedURIComponent(hash);
                    if (!json) return null;
                    return JSON.parse(json);
                } catch (e) {
                    console.warn('해시 복원 실패:', e);
                    return null;
                }
            }

            function setSquareStagePixelSize() {
                // 렌더링 정확도를 위해 "픽셀" 사이즈를 명확히 고정
                const stage = $('#stage');
                const wrap = stage.parentElement;
                // wrap의 실제 렌더링 폭을 읽어서 정사각으로 맞추기
                const w = Math.round(wrap.getBoundingClientRect().width);
                stage.style.width = w + 'px';
                stage.style.height = w + 'px';
                return w; // 픽셀 기준
            }

            // stage 상대값(0~1)을 픽셀로
            function relToPx(v, total) { return Math.round((v || 0) * total); }

            async function waitForImages(root) {
                const imgs = Array.from(root.querySelectorAll('img'));
                if (!imgs.length) return;
                await Promise.all(imgs.map(img => {
                    if (img.complete) return;
                    return new Promise(res => {
                        img.onload = img.onerror = res;
                    });
                }));
            }

            // ====== 복원 ======
            async function restore(state) {
                const stage = $('#stage');
                const bgLayer = $('#bgLayer');
                const dateLabel = $('#dateLabel');

                // 날짜
                dateLabel.textContent = state?.date || '—';

                // 스테이지 픽셀 크기 확정
                const size = setSquareStagePixelSize();

                // 배경
                bgLayer.removeAttribute('src'); // 초기화
                if (state?.bg) {
                    bgLayer.crossOrigin = 'anonymous';
                    bgLayer.decoding = 'async';
                    bgLayer.src = state.bg;
                } else {
                    // 배경 없으면 흰색 유지
                }

                // 기존 아이템 제거
                Array.from(stage.querySelectorAll('.item')).forEach(n => n.remove());

                // 아이템 생성
                (state?.items || []).forEach(it => {
                    // src 없으면 스킵
                    if (!it?.src) return;

                    const img = document.createElement('img');
                    img.className = 'item';
                    img.crossOrigin = 'anonymous';
                    img.decoding = 'async';
                    img.alt = 'item';

                    // 위치/크기(상대값 → 픽셀)
                    const pxL = relToPx(it.x, size);
                    const pxT = relToPx(it.y, size);
                    const pxW = relToPx(it.w, size);
                    const pxH = relToPx(it.h, size);

                    img.style.left = pxL + 'px';
                    img.style.top = pxT + 'px';
                    img.style.width = Math.max(pxW, 1) + 'px';
                    img.style.height = Math.max(pxH, 1) + 'px';
                    img.style.zIndex = String(it.z ?? 1);

                    const rot = it.rotate || 0;
                    const sc = it.scale || 1;
                    img.style.transform = `rotate(${rot}deg) scale(${sc})`;

                    // 마지막에 src 할당(레이아웃 먼저)
                    img.src = it.src;

                    stage.appendChild(img);
                });

                // 모든 이미지 로딩 대기 후 로딩표시 제거
                await waitForImages(stage);
                $('#loading').style.display = 'none';
            }

            // ====== 저장(전체가 잘리거나 일부만 찍히는 문제 해결판) ======
            async function exportSquarePng() {
                const src = $('#stage');
                if (!src) return;

                // 1) 오프스크린 복제(고정 해상도)
                const EXPORT = 1080; // 필요하면 1440/2048로 ↑
                const clone = src.cloneNode(true);
                Object.assign(clone.style, {
                    position: 'fixed', left: '-99999px', top: '0',
                    width: EXPORT + 'px', height: EXPORT + 'px',
                    border: 'none', overflow: 'hidden'
                });
                document.body.appendChild(clone);

                // 2) 복제 내부 이미지 로딩 대기
                await waitForImages(clone);

                // 3) 캡처 (뷰포트/스크롤 영향 제거)
                const cvs = await html2canvas(clone, {
                    backgroundColor: null,
                    useCORS: true,
                    scale: 2,                 // 레티나 품질
                    width: EXPORT,
                    height: EXPORT,
                    scrollX: 0, scrollY: 0,
                    windowWidth: EXPORT,
                    windowHeight: EXPORT
                });

                document.body.removeChild(clone);

                // 4) 다운로드
                const url = cvs.toDataURL('image/png', 0.95);
                const a = document.createElement('a');
                a.href = url;
                a.download = `moodiary_share_${Date.now()}.png`;
                a.click();
            }

            // ====== 초기 구동 ======
            async function boot() {
                const state = parseHash();
                if (!state) {
                    $('#loading').style.display = 'none';
                    $('#error').style.display = 'block';
                    return;
                }
                try {
                    await restore(state);
                } catch (e) {
                    console.error(e);
                    $('#loading').style.display = 'none';
                    $('#error').style.display = 'block';
                }
            }

            // 리사이즈 시에도 정사각 픽셀 다시 고정 + 재배치
            window.addEventListener('resize', () => {
                // 화면 회전 등에서 깨지는 것 방지: 사이즈 재설정 + 상대픽셀 재계산
                // 간단히: 해시 다시 파싱→복원 (state가 크지 않으므로 OK)
                const st = parseHash();
                if (st) restore(st);
            });

            // 저장 버튼
            $('#btnSave')?.addEventListener('click', exportSquarePng);

            // 시작
            boot();
        })();
    </script>
</body>

</html>
