<script>
    (function () {
        // 모든 <img> 로딩 대기
        async function waitForImages(root) {
            const imgs = Array.from(root.querySelectorAll('img'));
            await Promise.all(imgs.map(img => {
                if (img.complete) return;
                return new Promise(res => {
                    img.onload = img.onerror = res;
                });
            }));
        }

        // 저장 버튼: 오프스크린 복제본(1080x1080)으로 확정 캡처
        document.getElementById('btnSave')?.addEventListener('click', async () => {
            const src = document.getElementById('canvas');
            if (!src) return;

            // 1) 복제본 만들기 (화면 밖)
            const clone = src.cloneNode(true);
            const EXPORT = 1080;             // 내보낼 정사각 해상도(원하면 1440 등으로 ↑)
            Object.assign(clone.style, {
                position: 'fixed',
                left: '-99999px',
                top: '0',
                width: EXPORT + 'px',
                height: EXPORT + 'px',
                border: 'none',
                overflow: 'hidden'
            });
            document.body.appendChild(clone);

            // 2) 복제본 내부 이미지 로딩 대기
            await waitForImages(clone);

            // 3) 캡처 (뷰포트/스크롤 영향 제거 + 고정 크기)
            const cvs = await html2canvas(clone, {
                backgroundColor: null,
                useCORS: true,
                scale: 2,               // 선명도(RETINA면 2~3 권장)
                width: EXPORT,
                height: EXPORT,
                scrollX: 0,
                scrollY: 0,
                windowWidth: EXPORT,
                windowHeight: EXPORT
            });

            // 4) 복제본 제거 + 다운로드
            document.body.removeChild(clone);
            const url = cvs.toDataURL('image/png', 0.95);
            const a = document.createElement('a');
            a.href = url;
            a.download = `moodiary_share_${Date.now()}.png`;
            a.click();
        });
    })();
</script>
