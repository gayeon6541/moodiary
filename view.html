<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MOODIARY – 공유 보기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
        crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" crossorigin></script>
    <style>
        body {
            margin: 0;
            font-family: Pretendard, system-ui, -apple-system, sans-serif;
            background: #fff;
            color: #111;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 100vh;

            padding: 14px;
            box-sizing: border-box;
            gap: 14px;
        }


        #canvas {
            position: relative;
            width: min(92vw, 640px);
            aspect-ratio: 1/1;
            border: 0.5px solid #111;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            margin: 0 auto;
        }

        #canvas img {
            position: absolute;
            transform-origin: center center;
        }

        .hint {
            font-size: 13px;
            color: #777;
            text-align: center
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            appearance: none;
            border: 0.5px solid #111;
            background: #fff;
            padding: 8px 12px;
            cursor: pointer
        }

        .date-row {
            text-align: center;
            margin-top: 6px;
            margin-bottom: -2px;

        }

        .date-label {
            font-size: 13px;
            color: #777;
        }

        .meta-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            width: min(92vw, 640px);
            margin: 0 auto;

            padding: 4px 0;
        }

        .meta-date {
            flex: 0 0 auto;
            font-size: 13px;
            color: #777;
            min-width: 80px;

        }

        .meta-desc {
            flex: 1 1 auto;
            text-align: center;
            font-size: 13px;
            color: #555;
            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
            padding: 4px 6px;
        }

        .meta-save {
            margin-left: auto;

            flex: 0 0 auto;
        }

        @media (max-width:360px) {

            .meta-date,
            .meta-desc {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <header aria-label="top-bar"></header>
    <main>
        <!-- 캔버스 -->
        <div id="canvas" aria-label="공유 정원"></div>

        <!-- 한 줄 메타 바: [날짜 | 설명 | 저장] -->
        <div class="meta-bar">
            <div id="dateLabel" class="meta-date">—</div>
            <div id="descLabel" class="meta-desc">"이미지 저장" 버튼을 눌러 이미지를 저장하세요.</div>
            <button class="btn meta-save" id="btnSave">이미지로 저장</button>
        </div>

    </main>

    <!-- html2canvas (이미지 저장용) -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" crossorigin></script>
    <script>
        (function () {
            function restore(state) {
                const canvas = document.getElementById('canvas');
                if (!canvas) return;
                if (state.bg) canvas.style.backgroundImage = `url("${state.bg}")`;
                document.getElementById('dateLabel').textContent = state.date || '—';

                const W = canvas.clientWidth;
                const H = canvas.clientHeight;

                // 화면 표시용 DOM 복원 (현재 그대로 유지)
                (state.items || []).forEach(it => {
                    const img = document.createElement('img');
                    if (it.src) img.src = it.src;
                    img.style.left = (it.x * W) + 'px';
                    img.style.top = (it.y * H) + 'px';
                    img.style.width = (it.w * W) + 'px';
                    img.style.height = (it.h * H) + 'px';
                    img.style.zIndex = String(it.z ?? 0);
                    const rot = it.rotate || 0;
                    const sc = it.scale || 1;
                    img.style.transformOrigin = 'center center';
                    img.style.transform = `rotate(${rot}deg) scale(${sc})`;
                    canvas.appendChild(img);
                });
            }

            // 해시 복원
            const hash = location.hash.startsWith('#') ? location.hash.slice(1) : '';
            let __STATE__ = null;
            try {
                const json = LZString.decompressFromEncodedURIComponent(hash) || '';
                __STATE__ = JSON.parse(json);
                restore(__STATE__);
            } catch (e) { console.warn('복원 실패', e); }

            // ====== 저장: 상태를 캔버스에 직접 그려 PNG로 내보내기 ======
            async function drawImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = src;
                });
            }

            // CSS background-size: cover 와 동일한 방식으로 배경을 그리기
            function drawCover(ctx, img, W, H) {
                const iw = img.width, ih = img.height;
                if (!iw || !ih) return;
                const scale = Math.max(W / iw, H / ih);
                const dw = iw * scale, dh = ih * scale;
                const dx = (W - dw) / 2;
                const dy = (H - dh) / 2;
                ctx.drawImage(img, dx, dy, dw, dh);
            }

            async function renderStateToPNG(state, dispW, dispH) {
                // 고해상도 저장 (디바이스 DPR 반영) — 화질↑, 1:1 비율 유지
                const DPR = Math.max(1, Math.min(3, Math.round(window.devicePixelRatio || 1)));
                const W = Math.round(dispW * DPR);
                const H = Math.round(dispH * DPR);

                const cvs = document.createElement('canvas');
                cvs.width = W; cvs.height = H;
                const ctx = cvs.getContext('2d');

                // 배경
                if (state.bg) {
                    try {
                        const bg = await drawImage(state.bg);
                        drawCover(ctx, bg, W, H);
                    } catch (e) { }
                } else {
                    // 배경이 없으면 흰 배경
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, W, H);
                }

                // 오브젝트
                for (const it of (state.items || [])) {
                    if (!it?.src) continue;
                    try {
                        const img = await drawImage(it.src);
                        const x = (it.x || 0) * W;
                        const y = (it.y || 0) * H;
                        const w = (it.w || 0) * W;
                        const h = (it.h || 0) * H;
                        const rot = (it.rotate || 0) * Math.PI / 180;
                        const sc = it.scale || 1;

                        // DOM과 동일하게: 중심 기준 rotate/scale 후 그리기
                        const cx = x + w / 2, cy = y + h / 2;
                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.rotate(rot);
                        ctx.scale(sc, sc);
                        ctx.drawImage(img, -w / 2, -h / 2, w, h);
                        ctx.restore();
                    } catch (e) {
                        console.warn('오브젝트 로드 실패', it.src);
                    }
                }

                return cvs.toDataURL('image/png', 0.95);
            }

            document.getElementById('btnSave')?.addEventListener('click', async () => {
                const box = document.getElementById('canvas');
                if (!__STATE__ || !box) return;

                const dispW = box.clientWidth;
                const dispH = box.clientHeight;

                try {
                    const dataURL = await renderStateToPNG(__STATE__, dispW, dispH);
                    const a = document.createElement('a');
                    a.href = dataURL;
                    a.download = `moodiary_share_${Date.now()}.png`;
                    a.click();
                } catch (e) {
                    alert('이미지 저장에 실패했어요. 잠시 후 다시 시도해주세요.');
                    console.error(e);
                }
            });
        })();
    </script>


</body>

</html>
