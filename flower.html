<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃 카드 갤러리</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
        crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #111;
            --muted: #666;
            --bg: #fff;
            --header-h: 72px;

            --gap: 16px;
            --side: clamp(18px, 3.8vw, 48px);
            --card-b: #111;
            --surface: #fff;
            --gray: #f2f2f2;
            --pill: #111;
            --pill-bg: #fff7d6;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            cursor: none;

        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, Inter, sans-serif;
            line-height: 1.55;


        }


        header.site {
            position: sticky;
            top: 0;
            z-index: 50;
            height: var(--header-h);
            background: rgba(255, 255, 255, .9);
            backdrop-filter: blur(6px);
            border-bottom: 1px solid #eaeaea;
        }

        .wrap {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 var(--side);
        }

        .bar {
            height: var(--header-h);
            display: grid;
            gap: 10px;
            grid-template-columns: 140px 1fr auto auto;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .brand img {
            width: 40px;
            height: 40px;
            display: block;
            animation: float 2.4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        nav.main {
            display: flex;
            justify-content: flex-end;
            gap: 22px;
        }

        nav.main a {
            position: relative;
            text-decoration: none;
            color: var(--ink);
            padding: 4px 2px;
            font-weight: 500;
        }

        nav.main a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -6px;
            height: 2px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: 0 50%;
            transition: transform .25s;
        }

        nav.main a:hover::after {
            transform: scaleX(1);
        }

        .sound {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--muted);
            margin-left: clamp(10px, 1.2vw, 18px);
        }

        .sound button {
            border: 1.25px solid #000;
            border-radius: 0;
            background: #fff;
            padding: 8px 12px;
            cursor: pointer;
            transition: background .25s ease, color .25s ease;
        }

        .sound button:hover {
            background: #000;
            color: #fff;
        }


        .page {
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
            padding: 24px var(--side) 48px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .title {
            font-size: 30px;
            letter-spacing: .5px;
            text-align: center;
            margin: 10px 0 0;
            color: #222;
        }

        .sub {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 0 0 6px;
        }


        .circular-wrap {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            height: 640px;
            position: relative;
        }

        .circular-gallery {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            user-select: none;
            will-change: transform;
        }

        .circular-gallery:active {
            cursor: grabbing;
        }

        .cg-item {
            position: absolute;
            left: 25%;
            transform: translate(-50%, -50%);
            width: clamp(200px, 17vw, 260px);
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0, 0, 0, .10);
            transition: box-shadow .25s ease;
        }


        .cg-item .img {
            display: grid;
            place-items: center;
            background: #fff;
            aspect-ratio: 4/3;
        }

        .cg-item .img img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
            object-fit: contain;

        }


        .cg-item .caption {
            font-family: ui-serif, "Times New Roman", Georgia, serif !important;
            font-weight: 800 !important;
            letter-spacing: .8px !important;
            text-transform: uppercase;
            font-size: clamp(16px, 3.6vw, 22px) !important;
            color: #111 !important;
            padding: 6px 8px !important;

            text-align: center;
        }


        .hint {
            position: absolute;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
            background: #fff;
            padding: 6px 10px;
            border: 1px solid #e1e1e1;
        }


        .bottom-scroll {
            width: min(21000px, 100%);
            margin: 10px auto 0;
            height: 4px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .08);
            -webkit-appearance: none;
            appearance: none;
        }

        .bottom-scroll::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 12px;
            border-radius: 999px;
            border: 0;
            background: linear-gradient(45deg, #b7b7b7, #c8c8c8);
            cursor: pointer;
        }

        .bottom-scroll::-moz-range-thumb {
            width: 40px;
            height: 12px;
            border-radius: 999px;
            border: 0;
            background: linear-gradient(45deg, #a9a9a9, #d1d1d1);
            cursor: pointer;
        }


        @media(max-width:640px) {
            .bar {
                grid-template-columns: 110px 1fr auto auto;
            }
        }

        .flower-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            user-select: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            font-size: 24px;
            line-height: 1;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .12));
        }

        .flower-cursor::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #111;
            border-radius: 999px;
            box-sizing: border-box;
        }

        .flower-cursor.active {
            font-size: 26px;
        }

        .cg-item .caption {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- Header (index와 동일 구조) -->
    <header class="site">
        <div class="wrap">
            <div class="bar">
                <a class="brand" href="index.html" aria-label="MOODIARY Home">
                    <img src="img/sub-flower.svg" alt="MOODIARY 로고"><span>MOODIARY</span>
                </a>
                <div></div>
                <nav class="main" aria-label="Main">
                    <a href="today-loding.html">Today</a>
                    <a href="diary-loding.html">Diary</a>
                    <a href="flower-loding.html" class="active">Flower</a>
                </nav>
                <div class="sound">
                    <button id="soundToggle" aria-pressed="false">🔊 Sound (On)</button>
                    <audio id="bgm" preload="auto" autoplay loop playsinline src="audio/temp.m4a"></audio>
                </div>
            </div>
        </div>
    </header>


    <main class="page" aria-label="Flower Cards">

        <!-- Circular gallery -->
        <div class="circular-wrap">
            <div id="circularGallery" class="circular-gallery" aria-label="Flower circular gallery"></div>
        </div>

        <!-- (선택) 하단 커스텀 스크롤바: 갤러리 스크롤 연동 -->
        <input type="range" id="scrollbar" class="bottom-scroll" min="0" value="0" />

        <p class="sub">드래그 또는 스크롤로 카드를 넘겨보세요.</p>
    </main>

    <script>
        (function () {
            const STATE_KEY = 'moodiary_bgm_state'; // 'on' | 'off'
            const POS_KEY = 'moodiary_bgm_pos';   // number(sec)
            const VOL_KEY = 'moodiary_bgm_vol';   // '0.0' ~ '1.0'
            const DEFAULT_SRC = 'audio/temp.m4a';   // 페이지마다 다르면 여기 값으로 강제 통일됨

            const btn = document.getElementById('soundToggle');
            let audio = document.getElementById('bgm');

            if (!btn) return; // 버튼 없으면 패스(이 페이지에선 컨트롤하지 않음)

            // 오디오 엘리먼트가 없다면 동적으로 생성 (경로 통일)
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'bgm';
                audio.preload = 'auto';
                audio.loop = true;
                audio.playsInline = true;
                audio.src = DEFAULT_SRC;
                document.body.appendChild(audio);
            }

            // 소스 경로 강제 통일(서로 다른 페이지에서 경로가 달라도 동일화)
            if (!audio.getAttribute('src')) audio.setAttribute('src', DEFAULT_SRC);
            if (audio.getAttribute('src') !== DEFAULT_SRC) audio.setAttribute('src', DEFAULT_SRC);

            // 버튼 라벨/aria 갱신
            function setBtn(on) {
                btn.textContent = on ? '🔊 Sound (On)' : '🔈 Sound (Off)';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }

            // 부드러운 볼륨 페이드
            const FPS = 60;
            function fadeTo(target = 0.35, ms = 600) {
                target = Math.max(0, Math.min(1, target));
                const step = (target - audio.volume) / (ms / (1000 / FPS));
                const t = setInterval(() => {
                    audio.volume = Math.max(0, Math.min(1, audio.volume + step));
                    if ((step > 0 && audio.volume >= target) || (step < 0 && audio.volume <= target)) {
                        clearInterval(t);
                        localStorage.setItem(VOL_KEY, String(audio.volume));
                    }
                }, 1000 / FPS);
            }

            async function tryPlay() {
                try {
                    audio.muted = false;
                    audio.autoplay = false; // 깜빡 재생 방지
                    audio.removeAttribute('autoplay');

                    // 저장된 볼륨/위치 복원
                    const savedVol = parseFloat(localStorage.getItem(VOL_KEY) || '0.30');
                    audio.volume = isFinite(savedVol) ? savedVol : 0.30;

                    const pos = parseFloat(localStorage.getItem(POS_KEY) || '0');
                    const applyPos = () => {
                        if (isFinite(pos) && pos > 0 && (!isFinite(audio.duration) || pos < audio.duration - 0.4)) {
                            audio.currentTime = pos;
                        }
                    };
                    if (audio.readyState >= 1) applyPos();
                    else audio.addEventListener('loadedmetadata', applyPos, { once: true });

                    await audio.play();
                    setBtn(true);
                    fadeTo(parseFloat(localStorage.getItem(VOL_KEY) || '0.35'), 500);
                } catch {
                    // 사용자 제스처 필요: 한 번만 언락
                    setBtn(false);
                    const unlock = async () => {
                        try {
                            await audio.play();
                            setBtn(true);
                            fadeTo(parseFloat(localStorage.getItem(VOL_KEY) || '0.35'), 500);
                        } catch { }
                        finally {
                            window.removeEventListener('pointerdown', unlock, { once: true });
                        }
                    };
                    window.addEventListener('pointerdown', unlock, { once: true });
                }
            }

            // ▶ 위치 저장(페이지 이동/탭 전환 포함)
            const savePos = () => {
                if (isFinite(audio.currentTime)) localStorage.setItem(POS_KEY, String(audio.currentTime));
            };
            const posTimer = setInterval(savePos, 700);
            window.addEventListener('pagehide', savePos);
            window.addEventListener('beforeunload', savePos);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) savePos();
            });

            // ▶ 버튼 토글
            btn.addEventListener('click', async () => {
                const isOn = localStorage.getItem(STATE_KEY) === 'on';
                if (isOn) {
                    audio.pause();
                    setBtn(false);
                    localStorage.setItem(STATE_KEY, 'off');
                    savePos();
                } else {
                    localStorage.setItem(STATE_KEY, 'on');
                    await tryPlay();
                }
            });

            // ▶ 첫 진입: 저장 상태 반영
            const shouldOn = (localStorage.getItem(STATE_KEY) ?? 'on') === 'on';
            if (shouldOn) {
                tryPlay();
            } else {
                audio.pause();
                audio.autoplay = false;
                audio.removeAttribute('autoplay');
                setBtn(false);
            }

            // ▶ 탭 복귀 시: 켜둔 상태인데 멈춰 있으면 재개
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && localStorage.getItem(STATE_KEY) === 'on' && audio.paused) {
                    tryPlay();
                }
            });
        })();

        (function () {
            const root = document.getElementById('circularGallery');
            if (!root) return;

            const OPTIONS = {
                bend: 0.0,          // 0=직선
                borderRadius: 0.20,
                scrollEase: 0.035,
                scrollSpeed: 1.6
            };


            // 12 꽃 - 네가 만든 flowers2 SVG만 사용 (파일명은 필요에 따라 수정)
            const items = [
                'babybreath2',
                'lavender2',
                'freesia2',
                'daisy2',
                'white-lily2',
                'lilac2',
                'white-tulip2',
                'sunflower2',
                'peony2',
                'forgetmenot2',
                'lotus2',
                'hydrangea2'
            ].map(name => ({
                image: `img/flowers2/${name}.svg`,
                text: '' // 캡션 감춤: 위 CSS로 display:none 처리
            }));

            const cards = [];
            items.forEach(it => {
                const card = document.createElement('div');
                card.className = 'cg-item';
                card.style.setProperty('--br', OPTIONS.borderRadius);

                const imgBox = document.createElement('div');
                imgBox.className = 'img';
                const img = document.createElement('img');
                img.src = it.image; img.alt = it.text;
                imgBox.appendChild(img);

                card.appendChild(imgBox);
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `${it.text} 상세 보기`);

                // 클릭/Enter → 상세 이동
                const slug = it.image
                    .split('/').pop().replace(/\.svg$/i, '')
                    .replace(/2$/, '');
                card.addEventListener('click', () => {
                    location.href = `flower-detail.html?flower=${encodeURIComponent(slug)}`;
                });
                card.addEventListener('keydown', e => {
                    if (e.key === 'Enter') card.click();
                });

                root.appendChild(card);
                cards.push(card);
            });

            const state = {
                viewportW: 0,
                itemW: 0, itemH: 0,
                padding: 24,
                total: cards.length,
                baseX: [],
                stride: 0, widthTotal: 0,
                scroll: { current: 0, target: 0, last: 0 },
                isDown: false, startX: 0, startScroll: 0
            };

            function measure() {
                state.viewportW = root.clientWidth;

                // 카드 폭 측정(정확값)
                const temp = cards[0].cloneNode(true);
                temp.style.visibility = 'hidden';
                temp.style.transform = 'translate(-50%,-50%)';
                root.appendChild(temp);
                const r = temp.getBoundingClientRect();
                state.itemW = r.width; state.itemH = r.height;
                temp.remove();

                state.stride = state.itemW + state.padding;
                state.widthTotal = state.stride * state.total;

                state.baseX = Array.from({ length: state.total }, (_, i) => i * state.stride);
            }

            function arcY(x, H, bend) {
                if (bend === 0) return 0;
                const B = Math.abs(bend);
                const R = (H * H + B * B) / (2 * B);
                const ex = Math.min(Math.abs(x), H);
                const arc = R - Math.sqrt(Math.max(R * R - ex * ex, 0));
                return (bend > 0) ? -arc : arc;
            }

            function place() {
                const H = state.viewportW / 2;
                const bend = OPTIONS.bend;
                const centerX = state.scroll.current % state.widthTotal;

                for (let i = 0; i < state.total; i++) {
                    let x = state.baseX[i] - centerX;
                    if (x < -state.widthTotal / 2) x += state.widthTotal;
                    if (x > state.widthTotal / 2) x -= state.widthTotal;

                    const px = x;
                    const py = arcY(px, H, bend) * 0.9;

                    // 회전(아치 접선)
                    const rot = (bend === 0) ? 0 :
                        (Math.asin(Math.min(Math.max(px / ((H * H + Math.abs(bend) * Math.abs(bend)) / (2 * Math.abs(bend))), -1), 1)) * (bend > 0 ? -1 : 1));

                    const el = cards[i];
                    let t = `translate(calc(50% + ${px}px), calc(50% + ${py}px)) rotate(${rot}rad)`;

                    // 깊이감(중앙↑)
                    const far = Math.min(Math.abs(px) / H, 1);
                    const scale = 1 - far * 0.15;
                    t += ` scale(${scale})`;
                    el.style.transform = t;

                    // 뒤쪽은 투명/클릭 금지
                    if (Math.abs(px) > H * 0.9) {
                        el.style.opacity = 0;
                        el.style.pointerEvents = 'none';
                    } else {
                        el.style.opacity = 1;
                        el.style.pointerEvents = 'auto';
                    }
                    el.style.zIndex = String(1000 - Math.floor(far * 1000));
                }
            }

            function tick() {
                state.scroll.current += (state.scroll.target - state.scroll.current) * OPTIONS.scrollEase;
                place();
                state.scroll.last = state.scroll.current;
                requestAnimationFrame(tick);
            }

            // 입력
            function onWheel(e) {
                const dy = e.deltaY || e.wheelDelta || e.detail || 0;
                state.scroll.target += (dy > 0 ? OPTIONS.scrollSpeed : -OPTIONS.scrollSpeed) * state.stride * 0.2;
                syncRange();
            }
            function onDown(e) {
                state.isDown = true;
                state.startX = (e.touches ? e.touches[0].clientX : e.clientX);
                state.startScroll = state.scroll.target;
            }
            function onMove(e) {
                if (!state.isDown) return;
                const x = (e.touches ? e.touches[0].clientX : e.clientX);
                const dist = (state.startX - x) * OPTIONS.scrollSpeed * 0.6;
                state.scroll.target = state.startScroll + dist;
                syncRange();
            }
            function onUp() { state.isDown = false; }

            // 하단 range와 연동(옵션)
            const range = document.getElementById('scrollbar');
            function syncRangeMax() { if (range) range.max = String(state.widthTotal); }
            function syncRange() { if (range) range.value = String((state.scroll.target % state.widthTotal + state.widthTotal) % state.widthTotal); }
            if (range) {
                range.addEventListener('input', (e) => {
                    const v = Number(e.target.value) || 0;
                    state.scroll.target = v;
                });
            }

            measure(); place(); tick(); syncRangeMax(); syncRange();

            window.addEventListener('resize', () => { measure(); place(); syncRangeMax(); syncRange(); });
            root.addEventListener('wheel', onWheel, { passive: true });
            root.addEventListener('mousedown', onDown);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            root.addEventListener('touchstart', onDown, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onUp);
        })();
    </script>

    <script>
        // ✿ Custom Flower Cursor (same as index.html)
        (function () {
            const c = document.createElement('div');
            c.className = 'flower-cursor';
            c.textContent = '✿';
            document.body.appendChild(c);

            let x = 0, y = 0, tx = 0, ty = 0;
            document.addEventListener('mousemove', e => { x = e.clientX; y = e.clientY; });

            // 링크/버튼 위에 올리면 살짝 커지는 효과
            document.addEventListener('mouseover', e => {
                if (e.target.closest('a,button')) c.classList.add('active');
                else c.classList.remove('active');
            });

            // 부드러운 추적
            (function loop() {
                tx += (x - tx) * 0.25;
                ty += (y - ty) * 0.25;
                c.style.transform = `translate(${tx}px, ${ty}px) translate(-50%,-50%)`;
                requestAnimationFrame(loop);
            })();
        })();
    </script>
    <script>
        (function addClickSound() {
            // 클릭 사운드 오디오 요소 생성
            const clickSound = new Audio("audio/touch.mp3");

            // 로고와 메뉴 항목 선택
            const logo = document.querySelector(".brand");
            const menuLinks = document.querySelectorAll("nav.main a");

            // 클릭 시 사운드 재생하는 함수
            function playClickSound(e) {
                try {
                    clickSound.currentTime = 0; // 매번 처음부터 재생
                    clickSound.play();
                } catch (err) {
                    console.warn("Click sound failed:", err);
                }
            }

            // 로고와 메뉴 각각에 이벤트 바인딩
            if (logo) logo.addEventListener("click", playClickSound);
            menuLinks.forEach(link => link.addEventListener("click", playClickSound));
        })();
    </script>

</body>

</html>
