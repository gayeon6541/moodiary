<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>꽃 카드 상세</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
        crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #111;
            --muted: #666;
            --bg: #fff;
            --header-h: 72px;
            --side: clamp(18px, 3.8vw, 48px);
            --border-w: 1px;
            --line: #111;
            --radius: 0;
        }

        * {
            box-sizing: border-box
        }

        /* 🌸 배경 이미지 추가 (bg.svg 깔기) */
        body {
            margin: 0;
            background: url("img/bg.svg") center center / cover no-repeat fixed, var(--bg);
            color: var(--ink);
            font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, Inter, sans-serif;
            line-height: 1.6;
            cursor: none;
        }


        /* ===== Header ===== */
        header.site {
            position: sticky;
            top: 0;
            z-index: 50;
            height: var(--header-h);
        }

        .wrap {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 var(--side)
        }

        .bar {
            height: var(--header-h);
            display: grid;
            gap: 10px;
            grid-template-columns: 140px 1fr auto auto;
            align-items: center
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit
        }

        .brand img {
            width: 40px;
            height: 40px;
            display: block;
            animation: float 2.4s ease-in-out infinite
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-5px)
            }
        }

        nav.main {
            display: flex;
            justify-content: flex-end;
            gap: 22px
        }

        nav.main a {
            position: relative;
            text-decoration: none;
            color: var(--ink);
            padding: 4px 2px;
            font-weight: 500
        }

        nav.main a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -6px;
            height: 2px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: 0 50%;
            transition: transform .25s
        }

        nav.main a:hover::after {
            transform: scaleX(1)
        }

        .sound {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--muted);
            margin-left: clamp(10px, 1.2vw, 18px)
        }

        .sound button {
            border: 1.25px solid #000;
            border-radius: 0;
            background: #fff;
            padding: 8px 12px;
            cursor: pointer;
            transition: background .25s ease, color .25s ease
        }

        .sound button:hover {
            background: #000;
            color: #fff
        }

        /* ===== Page ===== */
        main.page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 24px var(--side) 64px
        }

        .crumbs {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
            color: #777;
            margin: 110px 0 16px
        }

        .crumbs a {
            color: inherit;
            text-decoration: none
        }

        .crumbs .sep {
            opacity: .5
        }

        /* ===== Centered 1:1 hero grid with single book background ===== */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* 좌/우 1:1 */
            column-gap: 0;
            /* 가운데 ‘딱 붙이기’ */
            justify-content: center;
            /* 수평 중앙 */
            align-content: center;
            /* 수직 중앙 */
            min-height: calc(100vh - var(--header-h) - 64px);
            /* 한 화면 중앙 */
            width: min(1200px, 92vw);
            margin: 0 auto;

            /* today.html 스타일: 한 장짜리 book 배경 */
            background: url("img/book.svg") center / 100% 100% no-repeat;
            position: relative;
        }

        /* 세션: 책 장 내부 여백으로 글·사진 간격 조절 */
        .session {
            display: grid;
            place-items: center;
            padding: 24px 16px;
        }

        .session.left {
            padding-right: clamp(60px, 8vw, 120px);
            /* ✅ 오른쪽 여백 확대 */
            transform: translateX(35px);
            /* ✅ 살짝 오른쪽으로 이동 */
        }

        /* 🌿 오른쪽 텍스트 살짝 왼쪽으로 이동 */
        .session.right {
            padding-left: clamp(12px, 3vw, 60px);
            /* ✅ 여백을 줄여 왼쪽으로 당김 */
            transform: translateX(-35px);
            /* ✅ 전체 블록을 약간 왼쪽으로 이동 */
        }

        /* Left: 꽃 이미지(조금 축소) */
        .hero-card {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            overflow: visible
        }

        .hero-img {
            display: grid;
            place-items: center;
            aspect-ratio: 1/1
        }

        .hero-img img {
            width: min(320px, 28vw);
            /* 살짝 작게 */
            max-width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Right: 좌정렬 텍스트 */
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            letter-spacing: .3px;
            margin: 0 0 6px;
            color: #222
        }

        .subtitle {
            margin: 0 0 14px;
            color: #666;
            font-size: 15px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 10px
        }

        .chip {
            border: var(--border-w) solid var(--line);
            background: #fff;
            padding: 8px 10px;
            border-radius: var(--radius);
            font-size: 13px
        }

        .meta {
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 18px 22px;
        }

        .meta dt {
            font-weight: 700;
        }

        .meta dd {
            margin: 0;
            color: #444;
            line-height: 1.6;
        }


        .nav-rows {
            margin-top: 120px;
            /* 기존 28px → 40px, 살짝 위 여백 */
            display: flex;
            justify-content: flex-end;
            /* ✅ 오른쪽 정렬 */
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: var(--border-w) solid var(--line);
            background: #fff;
            padding: 10px 14px;
            cursor: pointer;
            text-decoration: none;
            color: #111;
            transition: background .2s, color .2s, transform .1s;
            border-radius: var(--radius)
        }

        .btn:hover {
            background: #000;
            color: #fff
        }

        .btn:active {
            transform: translateY(1px)
        }

        .session.right {
            justify-items: start
        }

        .session.right .hero-detail {
            width: 100%;
            max-width: min(640px, 50vw);
            /* ✅ 폭 확장 */
            text-align: left;
            padding: 0 3vw;
            /* ✅ 내부 여백 추가 */
        }


        /* ===== Custom Flower Cursor ===== */
        .flower-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9999;
            pointer-events: none;
            user-select: none;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            font-size: 24px;
            line-height: 1;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .12))
        }

        .flower-cursor::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #111;
            border-radius: 999px;
            box-sizing: border-box
        }

        .flower-cursor.active {
            font-size: 26px
        }

        /* ===== Mobile: 위/아래 스택 ===== */
        @media (max-width:900px) {
            .hero {
                grid-template-columns: 1fr;
                row-gap: 20px;
                min-height: auto;
                background-size: 180% 100%;
                /* 작은 화면에서 테두리 살짝 확대 */
            }

            .session {
                padding: 16px
            }

            .session.left {
                padding-right: 16px
            }

            .session.right {
                padding-left: 16px
            }
        }

        /* 1) hero를 진짜 화면 중앙으로 — 부모의 좌우 패딩/최대폭 영향 제거 */
        main.page {
            max-width: none;
            /* 1040px 제한 해제 */
            padding-left: 0;
            /* 좌측 패딩 제거 */
            padding-right: 0;
            /* 우측 패딩 제거 */
        }

        /* 2) breadcrumbs는 기존처럼 중앙에, 가로 폭만 컨테이너 규격 유지 */
        .crumbs {
            max-width: 1040px;
            margin: 110px auto 16px;
            /* 가운데 정렬 */
            padding: 0 var(--side);
            /* 좌우 여백은 그대로 */
        }

        /* 3) book 그리드 자체를 뷰포트 기준 ‘정중앙’ 고정 */
        .hero {
            width: min(1200px, 92vw);
            /* 책 한 장 너비 */
            margin-left: auto;
            /* 가운데 정렬 */
            margin-right: auto;
            /* 가운데 정렬 */
            /* 이미 설정된 값들:
     display:grid;
     column-gap:0;                // 중앙 ‘딱 붙이기’
     background: url("img/book.svg") center / 100% 100% no-repeat;
     justify-content:center; align-content:center;
     min-height: calc(100vh - var(--header-h) - 64px);
  */
        }

        /* (선택) 아주 드물게 브라우저/확장 영향으로 미세하게 어긋나면, 다음 한 줄 추가:
.hero { background-position: 50% 50%; }  // center와 동일하지만 더 확실히 고정
*/
        /* === [NO SCROLL + FULL CENTER] 오버라이드 === */

        /* 0) 페이지 자체 스크롤 제거 */
        html,
        body {
            height: 100%;
            overflow-y: hidden;
            /* 세로 스크롤 금지 */
        }

        /* 1) 메인 래퍼를 뷰포트 높이에 맞추고 패딩 제거 */
        main.page {
            position: relative;
            max-width: none;
            /* 중앙 정렬 방해 제거 */
            padding: 0;
            /* 상/하 패딩 제거 (여백 때문에 스크롤 생김 방지) */
            height: calc(100vh - var(--header-h));
            /* 헤더 제외한 정확한 화면 높이 */
            margin: 0;
            /* 가로 여백 영향 제거 */
        }

        /* 2) crumbs는 레이아웃 높이에 영향 주지 않도록 '오버레이' 배치 */
        .crumbs {
            position: absolute;
            top: 8px;
            /* 헤더 아래 살짝 */
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 0 12px;
            max-width: none;
            z-index: 2;
            /* 북 배경 위로 */
        }

        /* 3) 북 배경 그리드가 메인 높이에 '정확히' 맞춰서 중앙 배치되도록 */
        .hero {
            /* 기존 min-height 값 무력화하고, 정확히 부모 높이 채우기 */
            min-height: 0 !important;
            height: 100% !important;

            /* 가로 중앙 정렬 */
            width: min(1300px, 92vw);
            margin-left: auto;
            margin-right: auto;

            /* 수평/수직 완전 중앙 */
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 0;
            /* 가운데 딱 붙이기 */
            justify-content: center;
            /* 수평 중앙 */
            align-content: center;
            /* 수직 중앙 */

            /* 한 장짜리 book 배경 */
            background: url("img/book.svg") center / 100% 100% no-repeat;
        }

        /* 4) 세션 내부 여백(글/사진 간격)은 최소화해서 높이 초과 방지 */
        .session {
            display: grid;
            place-items: center;
            padding: 16px 12px;
            /* 살짝 줄여 높이 여유 확보 */
        }

        .session.left {
            padding-right: clamp(16px, 4vw, 72px);
        }

        .session.right {
            padding-left: clamp(16px, 4vw, 72px);
        }

        /* 5) 콘텐츠 자체도 살짝 컴팩트하게 (높이 초과 방지) */
        .hero-img {
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
        }

        .hero-img img {
            width: min(300px, 26vw);
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .session.right {
            justify-items: start;
        }

        .session.right .hero-detail {
            width: 100%;
            max-width: min(570px, 50vw);
            text-align: left;
        }

        /* 6) 작은 화면/낮은 높이에서 추가로 더 콤팩트하게 */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                row-gap: 12px;
                background-size: 180% 100%;
            }

            .session {
                padding: 12px;
            }

            .session.left {
                padding-right: 12px;
            }

            .session.right {
                padding-left: 12px;
            }

            .hero-img img {
                width: min(260px, 40vw);
            }
        }

        @media (max-height: 720px) {
            .session {
                padding: 10px 12px;
            }

            .hero-img img {
                width: min(260px, 24vw);
            }

            .title {
                font-size: 30px;
            }

            .subtitle {
                font-size: 14px;
                margin-bottom: 10px;
            }

            .desc {
                font-size: 15px;
            }
        }

        /* crumbs 숨기기 */
        .crumbs {
            display: none !important;
        }

        .title-row {
            display: flex;
            align-items: baseline;
            /* 베이스라인 맞춤 */
            gap: 10px;
            flex-wrap: wrap;
        }

        .title-ko {
            font-family: Pretendard, system-ui, -apple-system, BlinkMacSystemFont, Inter, sans-serif;
            font-size: 15px;
            color: #666;
            font-weight: 400;
            line-height: 1;
            /* 제목 높이에 깔끔하게 붙도록 */
        }

        .desc {
            margin-bottom: 40px;
            /* 🔸 설명과 메타 사이에 살짝 여유 */
        }

        /* ✨ 하얀 반딧불이 효과 */
        .firefly {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 8px 4px rgba(255, 255, 255, 0.6);
            animation: fly 10s linear infinite, blink 2s ease-in-out infinite alternate;
        }

        @keyframes fly {
            0% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(50px, -80px) scale(1.2);
            }

            50% {
                transform: translate(-60px, -30px) scale(0.9);
            }

            75% {
                transform: translate(80px, 60px) scale(1.1);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }

        @keyframes blink {
            0% {
                opacity: 0.3;
                box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.4);
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 10px 6px rgba(255, 255, 255, 0.9);
            }

            100% {
                opacity: 0.2;
                box-shadow: 0 0 4px 2px rgba(255, 255, 255, 0.4);
            }
        }

        /* === [Fix] bottom scrollbar 제거 === */

        /* 1) 문서 전체에서 가로 스크롤 차단 */
        html,
        body {
            overflow-x: clip;
            /* 최신 브라우저 권장 */
            /* 필요하면 overflow-x: hidden; 로 바꿔도 OK */
        }

        /* 2) 배경 데코가 뷰포트 밖으로 번져서 스크롤 만드는 것 방지 */
        .background-decor {
            position: fixed;
            /* 화면에 고정 */
            inset: 0;
            /* 전체 덮기 */
            overflow: hidden;
            /* 내부 효과 잘라내기 */
            pointer-events: none;
            z-index: 0;
        }

        /* 3) 중앙 book 섹션에서 레이아웃 넘침 잘라내기 */
        .hero {
            overflow: clip;
            /* 또는 overflow: hidden; */
        }

        /* 4) 낮은 해상도/좁은 폭에서 좌우 translate로 넘침 나오는 경우 방지 */
        @media (max-width: 1200px) {
            .session.left {
                transform: none;
            }

            .session.right {
                transform: none;
            }
        }

        /* === 꽃 설명 & 각 항목 설명 폰트 축소 === */
        .desc {
            font-size: 14px;
            /* 기본 약 16px → 줄임 */
            line-height: 1.5;
            /* 줄 간격 살짝 줄이기 */
            font-weight: 400;
        }

        .meta dd {
            font-size: 14px;
            /* 항목 설명 폰트 축소 */
            line-height: 1.4;
            font-weight: 300;
        }

        .meta dt {
            font-size: 15px;
            font-weight: 500;
            /* "꽃말", "계절" 등 제목도 살짝 줄이기 */
        }

        /* === 목록 / 이전 / 다음 버튼 폰트 크기 조정 === */
        .nav-rows .btn {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }
    </style>
</head>

<body>
    <div class="background-decor" id="backgroundDecor"></div>

    <!-- Header -->
    <header class="site">
        <div class="wrap">
            <div class="bar">
                <a class="brand" href="index.html" aria-label="MOODIARY Home">
                    <img src="img/sub-flower.svg" alt="MOODIARY 로고"><span>MOODIARY</span>
                </a>
                <div></div>
                <nav class="main" aria-label="Main">
                    <a href="today-loding.html">Today</a>
                    <a href="diary-loding.html">Diary</a>
                    <a href="flower-loding.html" class="active">Flower</a>
                </nav>
                <div class="sound">
                    <button id="soundToggle" aria-pressed="false">🔊 Sound (On)</button>
                    <audio id="bgm" preload="auto" autoplay loop playsinline src="audio/temp.m4a"></audio>
                </div>
            </div>
        </div>
    </header>

    <main class="page" aria-label="Flower Detail">
        <nav class="crumbs" aria-label="breadcrumbs">
            <a href="flower.html">Flower</a><span class="sep">›</span><span id="crumbLabel">Detail</span>
        </nav>

        <section class="hero">
            <!-- LEFT: 꽃 카드 -->
            <section class="session left">
                <div class="hero-card">
                    <div class="hero-img">
                        <img id="f-img" alt="">
                    </div>
                </div>
            </section>

            <!-- RIGHT: 설명 -->
            <section class="session right">
                <div class="hero-detail">
                    <div class="title-row">
                        <h1 class="title" id="f-title">FLOWER</h1>
                        <span class="title-ko" id="f-title-ko"></span>
                    </div>
                    <!-- 🔧 여기 한 줄 추가 -->
                    <div class="desc" id="f-desc"></div>

                    <dl class="meta">
                        <div>
                            <dt>꽃말</dt>
                            <dd id="f-meaning">—</dd>
                        </div>
                        <div>
                            <dt>계절 / 개화시기</dt>
                            <dd id="f-season">—</dd>
                        </div>
                        <div>
                            <dt>색상 상징</dt>
                            <dd id="f-color">—</dd>
                        </div>
                        <div>
                            <dt>향기 / 질감</dt>
                            <dd id="f-scent">—</dd>
                        </div>
                        <div>
                            <dt>상징</dt>
                            <dd id="f-sym">—</dd>
                        </div>
                        <div>
                            <dt>연결 감정</dt>
                            <dd id="f-emote">—</dd>
                        </div>
                    </dl>


                    <div class="nav-rows">
                        <a class="btn" href="flower.html">← 목록으로</a>
                        <a class="btn" id="f-prev" href="#">〈 이전</a>
                        <a class="btn" id="f-next" href="#">다음 〉</a>
                    </div>
                </div>
            </section>
        </section>
    </main>



    <!-- ===== Detail Loader ===== -->
    <script>

        (function () {
            const STATE_KEY = 'moodiary_bgm_state'; // 'on' | 'off'
            const POS_KEY = 'moodiary_bgm_pos';   // number(sec)
            const VOL_KEY = 'moodiary_bgm_vol';   // '0.0' ~ '1.0'
            const DEFAULT_SRC = 'audio/temp.m4a';   // 페이지마다 다르면 여기 값으로 강제 통일됨

            const btn = document.getElementById('soundToggle');
            let audio = document.getElementById('bgm');

            if (!btn) return; // 버튼 없으면 패스(이 페이지에선 컨트롤하지 않음)

            // 오디오 엘리먼트가 없다면 동적으로 생성 (경로 통일)
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'bgm';
                audio.preload = 'auto';
                audio.loop = true;
                audio.playsInline = true;
                audio.src = DEFAULT_SRC;
                document.body.appendChild(audio);
            }

            // 소스 경로 강제 통일(서로 다른 페이지에서 경로가 달라도 동일화)
            if (!audio.getAttribute('src')) audio.setAttribute('src', DEFAULT_SRC);
            if (audio.getAttribute('src') !== DEFAULT_SRC) audio.setAttribute('src', DEFAULT_SRC);

            // 버튼 라벨/aria 갱신
            function setBtn(on) {
                btn.textContent = on ? '🔊 Sound (On)' : '🔈 Sound (Off)';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }

            // 부드러운 볼륨 페이드
            const FPS = 60;
            function fadeTo(target = 0.35, ms = 600) {
                target = Math.max(0, Math.min(1, target));
                const step = (target - audio.volume) / (ms / (1000 / FPS));
                const t = setInterval(() => {
                    audio.volume = Math.max(0, Math.min(1, audio.volume + step));
                    if ((step > 0 && audio.volume >= target) || (step < 0 && audio.volume <= target)) {
                        clearInterval(t);
                        localStorage.setItem(VOL_KEY, String(audio.volume));
                    }
                }, 1000 / FPS);
            }

            async function tryPlay() {
                try {
                    audio.muted = false;
                    audio.autoplay = false; // 깜빡 재생 방지
                    audio.removeAttribute('autoplay');

                    // 저장된 볼륨/위치 복원
                    const savedVol = parseFloat(localStorage.getItem(VOL_KEY) || '0.30');
                    audio.volume = isFinite(savedVol) ? savedVol : 0.30;

                    const pos = parseFloat(localStorage.getItem(POS_KEY) || '0');
                    const applyPos = () => {
                        if (isFinite(pos) && pos > 0 && (!isFinite(audio.duration) || pos < audio.duration - 0.4)) {
                            audio.currentTime = pos;
                        }
                    };
                    if (audio.readyState >= 1) applyPos();
                    else audio.addEventListener('loadedmetadata', applyPos, { once: true });

                    await audio.play();
                    setBtn(true);
                    fadeTo(parseFloat(localStorage.getItem(VOL_KEY) || '0.35'), 500);
                } catch {
                    // 사용자 제스처 필요: 한 번만 언락
                    setBtn(false);
                    const unlock = async () => {
                        try {
                            await audio.play();
                            setBtn(true);
                            fadeTo(parseFloat(localStorage.getItem(VOL_KEY) || '0.35'), 500);
                        } catch { /* no-op */ }
                        finally {
                            window.removeEventListener('pointerdown', unlock, { once: true });
                        }
                    };
                    window.addEventListener('pointerdown', unlock, { once: true });
                }
            }

            // ▶ 위치 저장(페이지 이동/탭 전환 포함)
            const savePos = () => {
                if (isFinite(audio.currentTime)) localStorage.setItem(POS_KEY, String(audio.currentTime));
            };
            const posTimer = setInterval(savePos, 700);
            window.addEventListener('pagehide', savePos);
            window.addEventListener('beforeunload', savePos);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) savePos();
            });

            // ▶ 버튼 토글
            btn.addEventListener('click', async () => {
                const isOn = localStorage.getItem(STATE_KEY) === 'on';
                if (isOn) {
                    audio.pause();
                    setBtn(false);
                    localStorage.setItem(STATE_KEY, 'off');
                    savePos();
                } else {
                    localStorage.setItem(STATE_KEY, 'on');
                    await tryPlay();
                }
            });

            // ▶ 첫 진입: 저장 상태 반영
            const shouldOn = (localStorage.getItem(STATE_KEY) ?? 'on') === 'on';
            if (shouldOn) {
                tryPlay();
            } else {
                audio.pause();
                audio.autoplay = false;
                audio.removeAttribute('autoplay');
                setBtn(false);
            }

            // ▶ 탭 복귀 시: 켜둔 상태인데 멈춰 있으면 재개
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && localStorage.getItem(STATE_KEY) === 'on' && audio.paused) {
                    tryPlay();
                }
            });
        })();

        (function SPAFlowerDetail() {
            const prevEl = document.getElementById('f-prev'); const nextEl = document.getElementById('f-next'); const titleEl = document.getElementById('f-title');
            function go(slug, { push = true } = {}) {
                const data = getData(slug); render(data);
                if (push) history.pushState({ slug }, '', `?flower=${encodeURIComponent(slug)}`);
                titleEl.setAttribute('tabindex', '-1'); titleEl.focus({ preventScroll: true });
            }
            function onClickNav(e) { e.preventDefault(); const url = new URL(e.currentTarget.href, location.href); const slug = url.searchParams.get('flower') || order[0]; go(slug, { push: true }); }
            prevEl.addEventListener('click', onClickNav); nextEl.addEventListener('click', onClickNav);
            window.addEventListener('popstate', e => { const slug = (e.state && e.state.slug) || (new URLSearchParams(location.search).get('flower')) || order[0]; go(slug, { push: false }); });
            const initial = (new URLSearchParams(location.search).get('flower')) || order[0]; history.replaceState({ slug: initial }, '', location.href);
        })();
    </script>
